# Nixpacks defaults to Node 18. pnpm 11 (packageManager) needs Node >= 22.13,
# but Nixpacks' Node 22 archive ships 22.11, so use its Node 24 archive.
[variables]
NIXPACKS_NODE_VERSION = "24"

# Nixpacks does not know pnpm 11 and falls back to the nix `pnpm-9_x` package,
# which shadows the pnpm installed below and rejects pnpm-workspace.yaml
# ("packages field missing or empty"). Install only Node and OpenSSL from nix.
[phases.setup]
nixPkgs = ["nodejs_24", "openssl"]

# Nixpacks' default install phase pins corepack 0.24.1
# (`npm install -g corepack@0.24.1 && corepack enable`), which cannot run
# pnpm 10+: old corepack executes pnpm's ESM entrypoint through a VM without
# a dynamic import callback, failing with:
#   TypeError [ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING]
# Install pnpm directly instead. Keep the version in sync with the
# "packageManager" field in package.json.
[phases.install]
cmds = [
  "npm install -g pnpm@11.7.0",
  "pnpm i --frozen-lockfile",
]
# Parent dir so the pnpm store is cached regardless of store layout version.
cacheDirectories = ["/root/.local/share/pnpm/store"]
